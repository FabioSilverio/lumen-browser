# Opcional: deploy em produção na Vercel quando `main` receber push.
# Alternativa recomendada: no painel da Vercel, Import Project → conecte o repositório GitHub
# (detecção automática de Vite; use a branch `main` como produção).
#
# Para usar este workflow, crie estes secrets no repositório GitHub:
#   VERCEL_TOKEN        — https://vercel.com/account/tokens
#   VERCEL_ORG_ID       — Team ID (Settings na Vercel) ou em .vercel/project.json após `vercel link`
#   VERCEL_PROJECT_ID   — Project ID (mesma origem)
#
# Sem esses secrets o job é ignorado (não falha o CI).

name: Deploy Vercel (production)

on:
  push:
    branches: [main]

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ secrets.VERCEL_TOKEN != '' && secrets.VERCEL_ORG_ID != '' && secrets.VERCEL_PROJECT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
